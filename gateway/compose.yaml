services:
  anyone:
    image: ghcr.io/anyone-protocol/anyone-rust:main
    command: ["proxy", "${ANYONE_TERMS_FLAG:?Read https://anyone.io/terms then explicitly set ANYONE_TERMS_FLAG}"]
    volumes:
      - anyone-state:/var/lib/anyone-rust
    restart: unless-stopped
  gateway:
    build: .
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Generate a random secret first}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - anyone
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  anyone-state:
